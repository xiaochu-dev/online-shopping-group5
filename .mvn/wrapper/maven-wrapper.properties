wrapperVersion=3.3.4
distributionType=only-script
# Download Maven from the Aliyun mirror to avoid slow/timeout on the central repo.
# IMPORTANT: keep this file ASCII-only.
# mvnw.cmd parses it with PowerShell `Get-Content -Raw | ConvertFrom-StringData`,
# and PowerShell 5.1 on zh-CN Windows decodes the file as GBK. A non-ASCII character
# right before the line break makes the decoder swallow the line break, so the next
# line (distributionUrl=...) becomes part of this comment, and mvnw.cmd fails with
# "cannot read distributionUrl property".
distributionUrl=https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
