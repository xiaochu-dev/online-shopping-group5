<!DOCTYPE html>
<!-- 卖家登录页 —— 账号模块：胡成溯（组长）T2-05 / FR-01 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('卖家登录')}"></head>
<body class="center-page">
<div class="card card-narrow">
    <h1>在线购物系统</h1>
    <p class="subtitle">卖家后台登录</p>

    <div class="banner banner-error" th:if="${error}" th:text="${error}">用户名或密码错误</div>

    <form method="post" th:action="@{/login}">
        <!-- 登录成功后跳回的地址，由拦截器写入；只允许站内路径，已在 Controller 校验 -->
        <input type="hidden" name="redirect" th:value="${redirect}">

        <div class="form-row">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" autocomplete="username"
                   required autofocus th:value="${username}">
        </div>
        <div class="form-row">
            <label for="password">密码</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>

    <p class="muted login-tip">
        默认账号 <code>admin</code> / <code>admin12345</code>，首次登录后请立即修改密码。
    </p>
</div>
</body>
</html>
