<!DOCTYPE html>
<!-- 卖家发货管理 —— 挑战需求 C.2.1 / C.2.2（负责人：胡成溯） -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('发货管理')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar('shipments')}"></div>

<div class="container">

    <h2>发货管理</h2>

    <div class="banner banner-ok" th:if="${param.msg}" th:text="${param.msg}">已发货</div>
    <div class="banner banner-error" th:if="${param.error}" th:text="${param.error}">发货失败</div>
    <div class="banner banner-error" th:if="${!orderServiceAvailable}">
        订单服务尚未接入（等待订单模块实现 <code>OrderShipPort</code>），暂时无法发货。
    </div>

    <div class="card">
        <p class="muted">
            这里只列出<b>已备货完成</b>的订单。选择承运商并填写运单号后，订单会推进到「已发货」，
            买家可在「物流查询」中看到轨迹。
        </p>
    </div>

    <div class="card empty-tip" th:if="${rows.isEmpty()}">
        <p class="muted">当前没有待发货的订单（订单需先由卖家推进到「备货完成」）。</p>
    </div>

    <div class="card" th:if="${!rows.isEmpty()}">
        <table class="table">
            <thead>
            <tr>
                <th>订单号</th>
                <th>买家</th>
                <th>收货信息</th>
                <th>商品</th>
                <th>下单时间</th>
                <th style="width:330px;">发货</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${rows}">
                <td th:text="${row.orderNo}">SO20261120000001</td>
                <td th:text="${row.buyerName}">buyer1</td>
                <td>
                    <span th:text="${row.phone}">13800000000</span><br>
                    <span class="muted" th:text="${row.address}">浙江省杭州市西湖区文一西路 18 号</span>
                </td>
                <td th:text="${row.itemsText}">机械键盘 ×1</td>
                <td th:text="${row.createdAtText}">
                    2026-11-20 14:00
                </td>
                <td>
                    <form method="post" th:action="@{'/admin/shipments/' + ${row.intentId} + '/ship'}"
                          class="inline-form">
                        <select name="carrier" required style="min-width:120px;">
                            <option value="">承运商</option>
                            <option th:each="c : ${carriers}" th:value="${c}"
                                    th:text="${c == 'SF' ? '顺丰速运' : (c == 'JD' ? '京东物流' : (c == 'ZTO' ? '中通快递' : '圆通速递'))}">
                                顺丰速运
                            </option>
                        </select>
                        <input type="text" name="trackingNo" required maxlength="32"
                               placeholder="运单号" style="min-width:150px;">
                        <button type="submit" class="btn btn-primary btn-sm">发货</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="action-block">
        <a class="btn btn-sm" th:href="@{/admin}">返回后台首页</a>
    </div>
</div>
</body>
</html>
