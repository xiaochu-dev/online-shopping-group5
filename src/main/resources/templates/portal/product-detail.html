<!DOCTYPE html>
<!-- 商品详情与提交意向 —— 买家门户：周到（T2-13） -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{portal/fragments :: head(${product.name})}"></head>
<body>
<div th:replace="~{portal/fragments :: buyerTopbar('detail')}"></div>

<div class="container">

    <p><a th:href="@{/}">← 返回商品列表</a></p>

    <!-- 提交失败提示（姓名为空、商品刚被下架等） -->
    <div class="banner banner-error" th:if="${error}" th:text="${error}"></div>

    <!-- ==================== 口令码：只在提交成功这一次响应里出现 ==================== -->
    <div class="card token-card" th:if="${tokenCode}">
        <div class="token-card-title">✓ 购买意向已提交，你已进入排队</div>
        <div class="token-card-line">
            <span th:text="${buyerName}">买家</span> 你本次的口令码是：
        </div>
        <div class="token-card-code">
            <span class="token-code" th:text="${tokenCode}">0000000000000000</span>
        </div>
        <div class="token-card-tip">
            请立即自行保存。口令码只显示这一次，丢失后无法撤销意向，页面刷新也不会再出现。
        </div>
        <div class="token-card-line" style="margin-top:12px;">
            撤销方式：回到<a th:href="@{/}">商品列表</a>，在「凭口令码撤销意向」里粘贴这串码。
        </div>
    </div>

    <!-- ==================== 商品信息 ==================== -->
    <div class="card">
        <div class="product-row">
            <img class="thumb thumb-large" th:src="@{'/' + ${product.imagePath}}" th:alt="${product.name}">
            <div class="product-info" style="flex:1;">
                <h2 style="margin-bottom:10px;" th:text="${product.name}">商品名称</h2>
                <p>
                    <span class="price" th:text="'¥ ' + ${product.priceYuan}">¥ 0.00</span>
                    <span class="tag tag-green" th:text="${product.statusLabel}">在售</span>
                </p>
                <p class="muted">
                    当前有 <b th:text="${queueSize}">0</b> 人在排队。
                    本系统按<strong>提交时间先到先得</strong>，越早提交排得越前。
                </p>
                <p th:if="${product.description != null and !product.description.isEmpty()}"
                   th:text="${product.description}" style="white-space:pre-wrap;">商品描述</p>
                <p class="muted" th:if="${product.description == null or product.description.isEmpty()}">
                    卖家未填写商品描述
                </p>
            </div>
        </div>
    </div>

    <!-- ==================== 提交购买意向（免注册免登录） ==================== -->
    <div class="card">
        <h2>提交购买意向</h2>
        <p class="muted">
            无需注册，填写姓名和联系电话即可排队。提交后会得到一串口令码，
            凭它可以撤销；同一号码可以重复提交，每次都是独立的一次排队。
        </p>
        <form method="post" th:action="@{'/products/' + ${product.id} + '/intents'}" class="form-narrow">
            <div class="form-row">
                <label for="buyerName">姓名 <span class="req">*</span></label>
                <input type="text" id="buyerName" name="buyerName" th:value="${buyerName}"
                       placeholder="请填写真实姓名" required>
            </div>
            <div class="form-row">
                <label for="phone">联系电话 <span class="req">*</span></label>
                <input type="tel" id="phone" name="phone" th:value="${phone}"
                       placeholder="请填写手机号，便于卖家联系" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">提交意向，进入排队</button>
        </form>
    </div>

</div>
</body>
</html>
