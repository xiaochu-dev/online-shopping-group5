<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{product/fragments::head('分类管理')}"></head><body>
<div th:replace="~{product/fragments::nav}"></div><main class="container"><div th:replace="~{product/fragments::feedback}"></div><h1>分类管理</h1><p class="muted">分类固定两级；商品发布时选择二级分类。停用一级分类后，其子类一起从买家筛选中隐藏。</p>
<form action="/admin/categories" method="post" class="card product-inline"><label>分类名称 <input name="name" required maxlength="80"></label><label>所属一级 <select name="parentId"><option value="">新建一级分类</option><option th:each="c:${categories}" th:if="${c.parentId==null and c.status=='enabled'}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>排序 <input type="number" name="sortNo" value="0"></label><button class="btn btn-primary">新增分类</button></form>
<div class="card"><table class="table"><thead><tr><th>名称</th><th>层级 / 父级编号</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="c:${categories}"><td th:text="${c.name}"></td><td th:text="${c.parentId==null?'一级':'二级 / '+c.parentId}"></td><td th:text="${c.statusLabel}"></td><td class="product-inline"><form th:action="@{/admin/categories/{id}/status(id=${c.id})}" method="post"><input type="hidden" name="enabled" th:value="${c.status!='enabled'}"><button class="btn" th:text="${c.status=='enabled'?'停用':'启用'}"></button></form><form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"><button class="btn">删除空分类</button></form></td></tr></tbody></table></div>
</main></body></html>
